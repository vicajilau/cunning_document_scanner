name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Filtering happens here rather than on the trigger so the check always reports
  # a status, which is what a required check on a protected branch needs.
  changes:
    name: Detect Android Changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # The Dart paths are here because this workflow builds the example app,
        # so a change to the plugin's Dart API can break it with no Kotlin touched.
        run: |
          relevant=$(./tool/has_changes.sh \
            android \
            example/android \
            lib \
            example/lib \
            pubspec.yaml \
            example/pubspec.yaml \
            .github/workflows/android.yml \
            tool/has_changes.sh)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Android build relevant: $relevant"

  android:
    name: Android Lint & Build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Ktlint
        run: |
          curl -sSL https://github.com/pinterest/ktlint/releases/latest/download/ktlint -o /usr/local/bin/ktlint
          chmod +x /usr/local/bin/ktlint

      - name: Run Ktlint Check
        run: ktlint "android/**/*.kt"

      - name: Build Android Example APK
        run: |
          cd example
          flutter pub get
          flutter build apk --debug

      # Runs after the APK build, which injects the Gradle wrapper (it is gitignored).
      - name: Run Android Unit Tests
        working-directory: example/android
        run: ./gradlew :cunning_document_scanner:testDebugUnitTest
