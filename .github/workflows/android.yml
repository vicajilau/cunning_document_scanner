name: Android CI

# Dart paths are included because this job builds the example app, so a change to
# the plugin's Dart API can break it even when no Kotlin file is touched.
on:
  push:
    branches: [ "master", "main" ]
    paths: &android-paths
      - 'android/**'
      - 'example/android/**'
      - 'lib/**'
      - 'example/lib/**'
      - 'pubspec.yaml'
      - 'example/pubspec.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths: *android-paths

jobs:
  android:
    name: Android Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Ktlint
        run: |
          curl -sSL https://github.com/pinterest/ktlint/releases/latest/download/ktlint -o /usr/local/bin/ktlint
          chmod +x /usr/local/bin/ktlint

      - name: Run Ktlint Check
        run: ktlint "android/**/*.kt"

      - name: Build Android Example APK
        run: |
          cd example
          flutter pub get
          flutter build apk --debug

      # Runs after the APK build, which injects the Gradle wrapper (it is gitignored).
      - name: Run Android Unit Tests
        working-directory: example/android
        run: ./gradlew :cunning_document_scanner:testDebugUnitTest
