name: iOS CI

# Dart paths are included because this job builds the example app, so a change to
# the plugin's Dart API can break it even when no Swift file is touched.
on:
  push:
    branches: [ "master", "main" ]
    paths: &ios-paths
      - 'ios/**'
      - 'example/ios/**'
      - '.swiftlint.yml'
      - 'lib/**'
      - 'example/lib/**'
      - 'pubspec.yaml'
      - 'example/pubspec.yaml'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths: *ios-paths

jobs:
  ios:
    name: iOS Lint & Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint ios
          else
            brew install swiftlint
            swiftlint lint ios
          fi

      - name: Build iOS Example App
        run: |
          cd example
          flutter pub get
          flutter build ios --no-codesign --debug
