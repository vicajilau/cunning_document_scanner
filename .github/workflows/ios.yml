name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same branch or pull request makes the running checks moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Filtering happens here rather than on the trigger so the check always reports
  # a status, which is what a required check on a protected branch needs.
  changes:
    name: Detect iOS Changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # The Dart paths are here because this workflow builds the example app,
        # so a change to the plugin's Dart API can break it with no Swift touched.
        run: |
          relevant=$(./tool/has_changes.sh \
            ios \
            example/ios \
            .swiftlint.yml \
            lib \
            example/lib \
            pubspec.yaml \
            example/pubspec.yaml \
            .github/workflows/ios.yml \
            tool/has_changes.sh \
            tool/remove_spm_integration.rb)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "iOS build relevant: $relevant"

  build:
    name: iOS Build & Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # Apps consume the plugin through either package manager, and each one packages
      # its sources and resources separately, so every integration is built and tested.
      # Static linkage is where CocoaPods copies loose resources into the app itself.
      matrix:
        include:
          - name: Swift Package Manager
            spm: enable-swift-package-manager
            linkage: ''
          - name: CocoaPods
            spm: no-enable-swift-package-manager
            linkage: ''
          - name: CocoaPods, static linkage
            spm: no-enable-swift-package-manager
            linkage: static

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run SwiftLint
        if: matrix.spm == 'enable-swift-package-manager'
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
          swiftlint lint ios

      - name: Select the package manager
        run: flutter config --${{ matrix.spm }}

      # A CocoaPods app carries no Swift Package Manager integration, but the example
      # was migrated and Flutter leaves the migration in place when the feature is off.
      - name: Remove the Swift Package Manager integration
        if: matrix.spm == 'no-enable-swift-package-manager'
        run: ruby tool/remove_spm_integration.rb example/ios/Runner.xcodeproj

      - name: Generate the iOS project
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign --debug

      # The Podfile is generated by the step above, with dynamic frameworks.
      - name: Switch CocoaPods to static linkage
        if: matrix.linkage == 'static'
        working-directory: example/ios
        run: |
          sed -i '' 's/^\( *\)use_frameworks!$/\1use_frameworks! :linkage => :static/' Podfile
          grep -q 'use_frameworks! :linkage => :static' Podfile
          pod install

      - name: Build iOS Example App
        working-directory: example
        run: flutter build ios --no-codesign --debug

      - name: Run native tests
        working-directory: example/ios
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | contains("SimRuntime.iOS"))]
            | sort_by(.key | capture("iOS-(?<major>[0-9]+)-(?<minor>[0-9]+)") | [(.major | tonumber), (.minor | tonumber)])
            | last | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          echo "Testing on simulator $udid"
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  # The single check a protected branch requires, whatever the matrix above holds.
  # Skipped builds pass, so a change with nothing for iOS is not held up.
  ios:
    name: iOS Lint & Build
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the iOS builds
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, relevant: $RELEVANT, build: $BUILD"
          [ "$CHANGES" = success ] || exit 1
          [ "$RELEVANT" = true ] || exit 0
          [ "$BUILD" = success ]
