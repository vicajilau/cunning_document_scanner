name: iOS CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  swiftlint:
    name: SwiftLint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
