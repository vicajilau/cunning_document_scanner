name: Version CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same branch or pull request makes the running checks moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Deliberately unfiltered. The check is plain bash with no toolchain to install
  # and finishes in seconds, so gating it would cost more than running it, and an
  # unconditional job is the simplest thing to require on a protected branch.
  version:
    name: Version Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Version Consistency
        run: ./tool/check_versions.sh
