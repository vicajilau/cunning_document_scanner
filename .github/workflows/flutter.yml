name: Flutter CI

# Dart-only concerns. Native sources are covered by android.yml and ios.yml, and
# version consistency by version.yml, so touching only Swift or Kotlin skips this.
on:
  push:
    branches: [ "master", "main" ]
    paths: &dart-paths
      - 'lib/**'
      - 'test/**'
      - 'example/lib/**'
      - 'example/test/**'
      - 'pubspec.yaml'
      - 'example/pubspec.yaml'
      - 'analysis_options.yaml'
      - 'example/analysis_options.yaml'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths: *dart-paths

jobs:
  flutter:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Project Source
        run: flutter analyze

      - name: Run Tests
        run: flutter test
