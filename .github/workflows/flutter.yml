name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Filtering happens here rather than on the trigger so the check always reports
  # a status, which is what a required check on a protected branch needs.
  changes:
    name: Detect Dart Changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          relevant=$(./tool/has_changes.sh \
            lib \
            test \
            example/lib \
            example/test \
            pubspec.yaml \
            example/pubspec.yaml \
            analysis_options.yaml \
            example/analysis_options.yaml \
            .github/workflows/flutter.yml \
            tool/has_changes.sh)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Dart checks relevant: $relevant"

  flutter:
    name: Flutter Lint & Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Project Source
        run: flutter analyze

      - name: Run Tests
        run: flutter test
